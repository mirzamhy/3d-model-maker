<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Uji Gerak F2</title>
  <style>
    :root { --bg: #0d0e10; --panel: #17191d; --line: #2a2d33; --text: #e6e3dd; --dim: #8d8a84; --acc: #e0a36a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }
    .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px; background: linear-gradient(transparent, rgba(13,14,16,.92) 30%);
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .sep { width: 1px; height: 24px; background: var(--line); margin: 0 6px; }
    button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; font: inherit; cursor: pointer; }
    button:hover { border-color: #4a4e56; }
    button.on { background: var(--acc); color: #1a1208; border-color: var(--acc); font-weight: 600; }
    label { color: var(--dim); display: flex; gap: 6px; align-items: center; }
    input[type=range] { width: 110px; accent-color: var(--acc); }
    .tag { position: fixed; top: 14px; padding: 8px 12px; background: rgba(23,25,29,.85); border: 1px solid var(--line); border-radius: 8px; pointer-events: none; }
    .tag b { display: block; font-size: 15px; }
    .tag span { color: var(--dim); font-size: 12px; }
    #tagOld { left: 16px; }
    #tagNew { right: 16px; text-align: right; }
    #note { position: fixed; top: 76px; left: 50%; transform: translateX(-50%); color: var(--dim); font-size: 12px; text-align: center; max-width: 90vw; pointer-events: none; }
    @media (max-width: 640px) { .sep { display: none; } .tag b { font-size: 13px; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="tag" id="tagOld"><b>Lama</b><span>F2 asli, kepala F2</span><br /><span id="statOld"></span></div>
  <div class="tag" id="tagNew"><b>Baru</b><span>F2 + kepala template</span><br /><span id="statNew"></span></div>
  <div id="note"></div>
  <div class="bar">
    <div class="group" id="moves"></div>
    <div class="sep"></div>
    <div class="group">
      <button id="bWire">Wireframe</button>
      <button id="bBones">Tulang</button>
      <button id="bPause">Jeda</button>
      <label>Kecepatan <input id="speed" type="range" min="0.2" max="2" step="0.1" value="1" /></label>
    </div>
    <div class="sep"></div>
    <div class="group" id="views"></div>
  </div>
  <script type="module" src="./gerak.ts"></script>
</body>
</html>
